[project]
name = "nlp-wisper-api"
version = "0.1.0"
description = "FastAPI backend: streams mic audio over WebSocket and transcribes it locally with Whisper (MLX)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "faster-whisper>=1.0.0; sys_platform != 'darwin'",
    "numpy",
]

[project.scripts]
nlp-wisper-api = "nlp_wisper_api.main:run"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
